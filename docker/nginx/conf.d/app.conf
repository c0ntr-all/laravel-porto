# nginx/conf.d/app.conf
server {
    listen 80;
    server_name docker-porto.loc localhost 127.0.0.1;

    root /var/www/laravel/public;
    index index.php index.html;

    client_max_body_size 50M;

    location ^~ /windows/images/ {
        alias /usr/share/nginx/images/;
        autoindex on;
        access_log /var/log/nginx/images_access.log;
        error_log /var/log/nginx/images_error.log debug;
        log_not_found on;
    }

    # Laravel public storage (storage:link -> storage/app/public)
    location ^~ /storage/mnt/f/ {
        alias /var/www/laravel/storage/mnt/f/;
        expires max;
        log_not_found off;
        add_header Accept-Ranges bytes;
    }

    location ^~ /storage/ {
        alias /var/www/laravel/public/storage/;
        expires max;
        log_not_found off;
    }

    location ^~ /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /broadcasting {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /up {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /telescope {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel Reverb (Pusher protocol) — /app/{key}
    location ^~ /app {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://php-app:8080;
    }

    location ~ \.php$ {
        fastcgi_pass   php-app:9000;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME /var/www/laravel/public$fastcgi_script_name;
        fastcgi_param  PATH_INFO $fastcgi_path_info;
    }

    # Quasar/Vite dev server (SPA + HMR)
    location / {
        proxy_pass http://quasar-client:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}
